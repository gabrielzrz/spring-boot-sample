# Database access
url=jdbc:postgresql://localhost:5432/spring_boot_sample
username=postgres
password=postgres
driver=org.postgresql.Driver
# Schemas
defaultSchemaName=public
referenceDefaultSchemaName=public
# Changelog files
changeLogFile=db/changelog/db.changelog-master.xml
diffChangeLogFile=src/main/resources/db/changelog/db.changelog-diff.xml
# Diff: exclude primarykeys - Hibernate reference never carries PK constraint names, so comparing it against the named PKs in the real DB always produces bogus dropPrimaryKey noise
diffTypes=tables, columns, views, indexes, foreignkeys, uniqueconstraints
# Reference (Hibernate)
referenceUrl=hibernate:spring:br.com.gabrielzrz.entity?dialect=org.hibernate.dialect.PostgreSQLDialect\
    &hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy\
    &hibernate.implicit_naming_strategy=org.springframework.boot.hibernate.SpringImplicitNamingStrategy
referenceDriver=liquibase.ext.hibernate.database.connection.HibernateDriver